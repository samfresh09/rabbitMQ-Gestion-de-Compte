spring.application.name=app-compte
server.port=8090

#configuration des datasource de RabbitMQ
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.port= 5672
spring.rabbitmq.template.exchange=user.new.notification

#KPI
application.exchange.user.name=user.new.kpi
application.exchange.user.routing-key=user.new.kpi

#NOTIFICATION
application.exchange.notification.name=user.new.notification
application.exchange.notification.routing-key=user.new.notification